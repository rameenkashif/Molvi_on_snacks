<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molvi on Snacks</title>
<meta name="description" content="Molvi on Snacks — hand-scooped ice cream with a desi twist.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ NAV ============ -->
<nav class="site-nav" id="site-nav">
  <a href="#hero" class="site-nav-logo">
    <img src="assets/images/navbar-logo.png" alt="Molvi on Snacks">
  </a>
  <ul class="site-nav-links">
    <li><a href="#hero" class="is-active">home</a></li>
    <li><a href="#">icecreams</a></li>
    <li><a href="#">samosas</a></li>
    <li><a href="#">shakes</a></li>
    <li><a href="#">cart</a></li>
  </ul>
  <img class="site-nav-mascot" src="assets/images/navbar-mascot.png" alt="">
</nav>

<!-- ============ HERO ============ -->
<section class="hero" id="hero">
  <div class="hero-bg-full" aria-hidden="true">
    <img src="assets/images/bg-mountain-full.jpg" alt="">
  </div>

  <div class="hero-wordmark" aria-hidden="true">
    <img src="assets/images/logo-white.png" alt="">
  </div>
  <h1 class="visually-hidden">Molvi on Snacks</h1>

  <div class="hero-bg-front" aria-hidden="true">
    <img src="assets/images/bg-mountain-front.png" alt="">
  </div>

  <div class="hero-wood" aria-hidden="true"></div>

  <div class="hero-buckets" aria-hidden="true">
    <figure class="hero-bucket hero-bucket--orea">
      <img src="assets/images/cup-orea.png" alt="">
    </figure>
    <figure class="hero-bucket hero-bucket--pista">
      <img src="assets/images/cup-pista.png" alt="">
    </figure>
    <figure class="hero-bucket hero-bucket--strawberry">
      <img src="assets/images/cup-strawberry.png" alt="">
    </figure>
  </div>

  <div class="hero-wave" aria-hidden="true">
    <svg viewBox="0 0 1440 100" preserveAspectRatio="none">
      <path d="M0,75 C72,75 72,25 144,25 C216,25 216,75 288,75 C360,75 360,25 432,25 C504,25 504,75 576,75 C648,75 648,25 720,25 C792,25 792,75 864,75 C936,75 936,25 1008,25 C1080,25 1080,75 1152,75 C1224,75 1224,25 1296,25 C1368,25 1368,75 1440,75 L1440,100 L0,100 Z"></path>
    </svg>
  </div>
</section>

<section class="next-page" id="next-page">
  <img class="cups-heading" src="assets/images/heading-icecreams.png" alt="Icecreams">
  <div class="cups-row">
    <figure class="cup-card cup-card--orea" tabindex="0" role="button" aria-pressed="false">
      <div class="cup-card-bg" aria-hidden="true"></div>
      <figcaption class="cup-card-label">Orea Barkat</figcaption>
      <img class="cup-card-img" src="assets/images/cup-orea-card.png" alt="Orea Barkat ice cream cup">
    </figure>
    <figure class="cup-card cup-card--strawberry" tabindex="0" role="button" aria-pressed="false">
      <div class="cup-card-bg" aria-hidden="true"></div>
      <figcaption class="cup-card-label">Ishq e Strawberry</figcaption>
      <img class="cup-card-img" src="assets/images/cup-strawberry-card.png" alt="Ishq e Strawberry ice cream cup">
    </figure>
    <figure class="cup-card cup-card--pista" tabindex="0" role="button" aria-pressed="false">
      <div class="cup-card-bg" aria-hidden="true"></div>
      <figcaption class="cup-card-label">Shifa e Pista</figcaption>
      <img class="cup-card-img" src="assets/images/cup-pista-card.png" alt="Shifa e Pista ice cream cup">
    </figure>
  </div>
  <button type="button" class="cups-cta">scoop now</button>
</section>

<div class="cups-footer" aria-hidden="true">
  <svg class="cups-drip" viewBox="0 0 1440 148" preserveAspectRatio="none">
    <path d="M0,0 L15.1,0 C33.6,0 18.2,132.7 92.2,141.1 C166.2,132.7 150.8,0 169.2,0 L181.2,0 C203.6,0 185.0,130.9 274.6,139.3 C364.1,130.9 345.5,0 367.9,0 L379.9,0 C398.5,0 383.0,131.1 457.4,139.5 C531.8,131.1 516.3,0 534.9,0 L546.9,0 C567.1,0 550.3,132.4 631.3,140.8 C712.3,132.4 695.4,0 715.7,0 L727.7,0 C747.2,0 730.9,134.7 809.3,143.3 C887.6,134.7 871.3,0 890.9,0 L902.9,0 C924.9,0 906.6,138.6 994.4,147.5 C1082.3,138.6 1064.0,0 1085.9,0 L1097.9,0 C1116.3,0 1101.0,123.5 1174.5,131.4 C1248.0,123.5 1232.7,0 1251.1,0 L1264.3,0 C1284.3,0 1267.7,134.1 1347.5,142.7 C1427.3,134.1 1410.6,0 1430.6,0 L1440,0 Z"></path>
  </svg>
  <div class="cups-footer-checker"></div>
</div>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
