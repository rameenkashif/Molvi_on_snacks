<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molvi on Snacks</title>
<meta name="description" content="Molvi on Snacks — hand-scooped ice cream with a desi twist.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HERO ============ -->
<section class="hero" id="hero">
  <div class="hero-bg-full" aria-hidden="true">
    <img src="assets/images/bg-mountain-full.jpg" alt="">
  </div>

  <div class="hero-wordmark" aria-hidden="true">
    <img src="assets/images/logo-white.png" alt="">
  </div>
  <h1 class="visually-hidden">Molvi on Snacks</h1>

  <div class="hero-bg-front" aria-hidden="true">
    <img src="assets/images/bg-mountain-front.png" alt="">
  </div>

  <p class="hero-tagline">hand-scooped desi ice cream, made with <em>ishq</em> &amp; <em>barkat</em></p>

  <div class="hero-floor" aria-hidden="true"></div>

  <div class="hero-tubs">
    <figure class="hero-tub" data-tub="orea">
      <img src="assets/images/cup-orea.png" alt="">
      <figcaption>Orea Barkat</figcaption>
    </figure>
    <figure class="hero-tub hero-tub--lead" data-tub="strawberry">
      <img src="assets/images/cup-strawberry.png" alt="">
      <figcaption>Ishq e Strawberry</figcaption>
    </figure>
    <figure class="hero-tub" data-tub="pista">
      <img src="assets/images/cup-pista.png" alt="">
      <figcaption>Shifa e Pista</figcaption>
    </figure>
  </div>

  <div class="hero-wave" aria-hidden="true">
    <svg viewBox="0 0 1440 140" preserveAspectRatio="none"><path d="M0,80 C240,140 360,10 600,40 C840,70 960,140 1200,90 C1320,65 1400,70 1440,80 L1440,140 L0,140 Z"/></svg>
  </div>

  <span class="hero-scroll-cue" aria-hidden="true">
    <span></span>
  </span>
</section>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
